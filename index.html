<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Room Walkthrough</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #181a20;
      --panel-border: #2a2e39;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --accent: #2f81f7;
      --accent-hover: #58a6ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }
    #setup {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding: 20px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 32px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    h1 { font-size: 1.5rem; margin-bottom: 8px; font-weight: 600; }
    p.subtitle { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 24px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-size: 0.85rem; font-weight: 500; margin-bottom: 8px; color: var(--text-muted); }
    .color-row { display: flex; gap: 12px; align-items: center; }
    input[type="color"] {
      -webkit-appearance: none;
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      width: 44px;
      height: 44px;
      cursor: pointer;
      background: none;
    }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: none; border-radius: 5px; }
    .btn-group { display: flex; gap: 10px; margin-top: 10px; }
    button {
      background: #21262d;
      border: 1px solid var(--panel-border);
      color: var(--text);
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
    }
    button:hover { background: #30363d; border-color: #8b949e; }
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      width: 100%;
      margin-top: 24px;
      padding: 12px;
      font-size: 1rem;
    }
    button.primary:hover { background: var(--accent-hover); }
    #piece-list {
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
      max-height: 80px;
      overflow-y: auto;
    }
    #viewer { display: none; width: 100vw; height: 100vh; position: relative; }
    canvas { width: 100%; height: 100%; display: block; }
    #overlay {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 17, 21, 0.75);
      border: 1px solid var(--panel-border);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      color: var(--text-muted);
      pointer-events: none;
    }
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,0.4);
      pointer-events: none;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="setup">
    <div class="card">
      <h1>3D Room Studio</h1>
      <p class="subtitle">Set up your architectural interior space</p>

      <div class="form-group">
        <label>Wall Material Color</label>
        <div class="color-row">
          <input type="color" id="wallColor" value="#d8d4cf">
          <span style="font-size: 0.85rem; color: var(--text-muted);">Concrete / Matte Wall</span>
        </div>
      </div>

      <div class="form-group">
        <label>Add Elements</label>
        <div class="color-row" style="margin-bottom: 10px;">
          <input type="color" id="pieceColor" value="#504337">
          <span style="font-size: 0.85rem; color: var(--text-muted);">Element Material</span>
        </div>
        <div class="btn-group">
          <button type="button" onclick="addPiece('block')">+ Sofa / Block</button>
          <button type="button" onclick="addPiece('table')">+ Studio Table</button>
        </div>
        <div id="piece-list">Elements placed: 0</div>
      </div>

      <button class="primary" onclick="enterRoom()">Enter 3D Room</button>
    </div>
  </div>

  <div id="viewer">
    <canvas id="canvas"></canvas>
    <div id="crosshair"></div>
    <div id="overlay">Click to look around | W A S D to move | ESC to release</div>
  </div>

  <script>
    const pieces = [];

    function addPiece(type) {
      const color = document.getElementById('pieceColor').value;
      const angle = Math.random() * Math.PI * 2;
      const dist = 1.0 + Math.random() * 2.0;
      const x = Math.cos(angle) * dist;
      const z = Math.sin(angle) * dist;
      pieces.push({ type, color, x, z });
      
      const list = document.getElementById('piece-list');
      list.innerText = `Elements placed: ${pieces.length} (${pieces.map(p => p.type).join(', ')})`;
    }

    function enterRoom() {
      const wallColor = document.getElementById('wallColor').value;
      document.getElementById('setup').style.display = 'none';
      document.getElementById('viewer').style.display = 'block';
      buildScene(wallColor);
    }

    function buildScene(wallHex) {
      const canvas = document.getElementById('canvas');
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x121417);

      const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 1.6, 0);

      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      // Lighting
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
      scene.add(ambientLight);

      const ceilingLight = new THREE.PointLight(0xfff3e0, 0.8, 15);
      ceilingLight.position.set(0, 2.7, 0);
      scene.add(ceilingLight);

      // Materials
      const wallMat = new THREE.MeshStandardMaterial({ color: wallHex, roughness: 0.85 });
      const floorMat = new THREE.MeshStandardMaterial({ color: 0x22252a, roughness: 0.5 });
      const ceilingMat = new THREE.MeshStandardMaterial({ color: 0x181a1f, roughness: 0.9 });

      const ROOM_SIZE = 8;
      const ROOM_HEIGHT = 3;

      // Floor & Ceiling
      const floor = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_SIZE, ROOM_SIZE), floorMat);
      floor.rotation.x = -Math.PI / 2;
      scene.add(floor);

      const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_SIZE, ROOM_SIZE), ceilingMat);
      ceiling.position.y = ROOM_HEIGHT;
      ceiling.rotation.x = Math.PI / 2;
      scene.add(ceiling);

      // Walls
      const wallGeo = new THREE.PlaneGeometry(ROOM_SIZE, ROOM_HEIGHT);
      const wallDefs = [
        { pos: [0, ROOM_HEIGHT / 2, -ROOM_SIZE / 2], rot: [0, 0, 0] },
        { pos: [0, ROOM_HEIGHT / 2, ROOM_SIZE / 2], rot: [0, Math.PI, 0] },
        { pos: [-ROOM_SIZE / 2, ROOM_HEIGHT / 2, 0], rot: [0, Math.PI / 2, 0] },
        { pos: [ROOM_SIZE / 2, ROOM_HEIGHT / 2, 0], rot: [0, -Math.PI / 2, 0] },
      ];

      wallDefs.forEach(def => {
        const wall = new THREE.Mesh(wallGeo, wallMat);
        wall.position.set(...def.pos);
        wall.rotation.set(...def.rot);
        scene.add(wall);
      });

      // Spawn Elements
      pieces.forEach(p => {
        let geo, mat = new THREE.MeshStandardMaterial({ color: p.color, roughness: 0.6 });
        let mesh;
        if (p.type === 'block') {
          geo = new THREE.BoxGeometry(1.6, 0.6, 0.8);
          mesh = new THREE.Mesh(geo, mat);
          mesh.position.set(p.x, 0.3, p.z);
        } else {
          geo = new THREE.BoxGeometry(1.2, 0.75, 1.2);
          mesh = new THREE.Mesh(geo, mat);
          mesh.position.set(p.x, 0.375, p.z);
        }
        scene.add(mesh);
      });

      // Controls
      let isLocked = false;
      let yaw = 0, pitch = 0;
      const keys = { KeyW: false, KeyS: false, KeyA: false, KeyD: false };

      canvas.addEventListener('click', () => canvas.requestPointerLock());

      document.addEventListener('pointerlockchange', () => {
        isLocked = document.pointerLockElement === canvas;
      });

      document.addEventListener('mousemove', (e) => {
        if (!isLocked) return;
        yaw -= e.movementX * 0.002;
        pitch -= e.movementY * 0.002;
        pitch = Math.max(-Math.PI / 2 + 0.05, Math.min(Math.PI / 2 - 0.05, pitch));

        const euler = new THREE.Euler(0, 0, 0, 'YXZ');
        euler.x = pitch;
        euler.y = yaw;
        camera.quaternion.setFromEuler(euler);
      });

      document.addEventListener('keydown', (e) => { if (keys.hasOwnProperty(e.code)) keys[e.code] = true; });
      document.addEventListener('keyup', (e) => { if (keys.hasOwnProperty(e.code)) keys[e.code] = false; });

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      const clock = new THREE.Clock();

      function animate() {
        requestAnimationFrame(animate);
        const delta = clock.getDelta();

        if (isLocked) {
          const moveSpeed = 4.0;
          const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
          const right = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
          const moveDir = new THREE.Vector3();

          if (keys.KeyW) moveDir.add(forward);
          if (keys.KeyS) moveDir.sub(forward);
          if (keys.KeyD) moveDir.add(right);
          if (keys.KeyA) moveDir.sub(right);

          if (moveDir.lengthSq() > 0) {
            moveDir.normalize();
            camera.position.addScaledVector(moveDir, moveSpeed * delta);
          }

          const bound = ROOM_SIZE / 2 - 0.3;
          camera.position.x = Math.max(-bound, Math.min(bound, camera.position.x));
          camera.position.z = Math.max(-bound, Math.min(bound, camera.position.z));
        }

        renderer.render(scene, camera);
      }

      animate();
    }
  </script>
</body>
</html>
